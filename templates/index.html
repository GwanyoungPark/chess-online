<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess Online</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="container">
    <h1>♟ Chess Online</h1>

    <div id="lobby">
      <input id="room-input" placeholder="Enter room code (e.g. room1)" />
      <button onclick="joinGame()">Join Game</button>
      
      <!-- DYNAMIC PATCH NOTES SECTION -->
      <div id="patch-notes">
        <h2>📜 Brief Patch Notes</h2>
        <ul>
          {% for note in patch_notes %}
            <li><strong>{{ note.date }} - {{ note.feature }}:</strong> {{ note.description }}</li>
          {% else %}
            <li>No recent patch notes.</li>
          {% endfor %}
        </ul>
      </div>
    </div>

    <div id="game" style="display:none">
      <div id="status"></div>
      
      <!-- Flex container to put board and move list side-by-side -->
      <div style="display: flex; gap: 20px; justify-content: center; align-items: flex-start;">
        
        <!-- Left Side: Board & Buttons -->
        <div>
          <!-- NEW PROMOTION MENU -->
          <div id="promotion-menu" style="display: none; margin-bottom: 15px; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 8px; border-left: 5px solid #e94560;">
            <p style="margin-top: 0; color: #eee; font-weight: bold;">Choose Promotion Piece:</p>
            <button onclick="choosePromotion('q')">♕ Queen</button>
            <button onclick="choosePromotion('r')">♖ Rook</button>
            <button onclick="choosePromotion('b')">♗ Bishop</button>
            <button onclick="choosePromotion('n')">♘ Knight</button>
            <button onclick="cancelPromotion()" style="background: #555;">Cancel</button>
          </div>
          <!-- END PROMOTION MENU -->
          <div id="board" style="width:480px"></div>
          <div id="turn-indicator"></div>
          <br>
          
          <!-- History Navigation Arrows -->
          <div style="margin-bottom: 15px;">
            <button onclick="navigateHistory(-1)">⬅️ Back</button>
            <button onclick="navigateHistory(1)">Forward ➡️</button>
          </div>
          
          <button onclick="leaveRoom()">Return to Lobby</button>
          <button onclick="resignGame()">Resign</button>
          <button onclick="offerDraw()">Offer Draw</button> 
        </div>

        <!-- Right Side: Move List -->
        <div id="move-list-container" style="width: 220px; height: 480px; overflow-y: auto; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 15px; text-align: left; border-left: 5px solid #e94560;">
          <h3 style="margin-top: 0; color: #e94560; text-align: center;">Move List</h3>
          <table style="width: 100%; color: #eee; font-size: 1.1rem;">
            <tbody id="move-table">
              <!-- Moves will be injected here via JavaScript -->
            </tbody>
          </table>
        </div>
        
      </div>
    </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>

  <script>
    const socket = io();
    let board, game;
    let myColor = null;
    let roomId = null;
    let isResigned = false; // Add this custom flag
    let pendingPromotion = null; // Tracks a move while the menu is open
    let currentMoveOffset = 0; // Tracks which past move we are looking at
    let isViewingHistory = false; // Flags if we are looking at the past

    // 1. Automatically generate or retrieve the player's secret ID
    let username = localStorage.getItem('chessPlayerId');
    if (!username) {
      // Generates a random ID like 'player_5b3a1' and saves it
      username = 'player_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('chessPlayerId', username);
    }

    // 2. Check if a room code is already in the URL when the page loads
    const urlParams = new URLSearchParams(window.location.search);
    const urlRoom = urlParams.get('room');

    if (urlRoom) {
      // If a room is in the URL, auto-join immediately!
      document.getElementById('room-input').value = urlRoom;
      joinGame();
    }

    function joinGame() {
      roomId = document.getElementById('room-input').value.trim();
      if (!roomId) return alert('Enter a room code!');

      // 3. Update the URL so that if they refresh, the room code is remembered
      window.history.replaceState(null, '', '?room=' + roomId);

      // Send the room and the auto-generated username to the server
      socket.emit('join', { room: roomId, username: username });
      
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game').style.display = 'block';
    }

    function resignGame() {
      if (!roomId) return; // Make sure they are actually in a room
      
      // Add a quick confirmation popup so they don't click it by accident
      if (confirm("Are you sure you want to resign?")) {
        socket.emit('resign', { room: roomId, username: username });
      }
    }

    function offerDraw() {
      if (!roomId) return;
      if (confirm("Are you sure you want to offer a draw?")) {
        socket.emit('draw_offer', { room: roomId, username: username });
      }
    }

    function leaveRoom() {
      // 1. Remove the "?room=..." parameter from the URL
      window.history.replaceState(null, '', window.location.pathname);
      
      // 2. Reload the page to reset everything
      window.location.reload();
    }

    socket.on('assigned_color', (data) => {
      myColor = data.color;
      
      // Default the spectator's board orientation to white
      const boardOrientation = (myColor === 'black') ? 'black' : 'white';
      
      // Update the status text so they know they are just watching
      if (myColor === 'spectator') {
        document.getElementById('status').textContent = '👁️ You are spectating';
      } else {
        document.getElementById('status').textContent = `You are playing as ${myColor}`;
      }

      game = new Chess();
      board = Chessboard('board', {
        draggable: (myColor !== 'spectator'), // COMPLETELY disables dragging for spectators
        position: 'start',
        orientation: boardOrientation,
        onDragStart,
        onDrop,
        onSnapEnd,
        pieceTheme: 'https://raw.githubusercontent.com/oakmac/chessboardjs/master/website/img/chesspieces/wikipedia/{piece}.png'
      });
    });

    socket.on('board_state', (data) => {
      // Rebuild the game history from the backend moves
      game = new Chess();
      if (data.moves) {
        data.moves.forEach(m => {
          // chess.js cleanly processes standard UCI moves (e.g., 'e2e4' or 'e7e8q')
          game.move({
            from: m.substring(0, 2),
            to: m.substring(2, 4),
            promotion: m.length > 4 ? m[4] : undefined 
          });
        });
      }

      // If we are looking at the live board, snap the pieces to the current state
      if (!isViewingHistory) {
        board.position(game.fen());
        currentMoveOffset = game.history().length;
      }
      
      updateMoveList();
      
      // DELETED game.load(data.fen) and board.position(data.fen) from here!

      const isMyTurn =
        (game.turn() === 'w' && myColor === 'white') ||
        (game.turn() === 'b' && myColor === 'black');

      document.getElementById('turn-indicator').textContent =
        isMyTurn ? '🟢 Your turn' : '⏳ Opponent\'s turn';

      if (data.result === 'checkmate') {
        document.getElementById('status').textContent =
          isMyTurn ? '😞 You lost! Checkmate.' : '🏆 You won! Checkmate!';
      } else if (data.result === 'stalemate') {
        document.getElementById('status').textContent = '🤝 Stalemate! Draw.';
      } else if (data.result === 'check') {
        document.getElementById('turn-indicator').textContent += ' ⚠️ Check!';
      } else if (data.result === 'white_resigned') {
        isResigned = true; // Lock the game
        document.getElementById('status').textContent = 'White resigned! Black wins! 🎉';
      } else if (data.result === 'black_resigned') {
        isResigned = true; // Lock the game
        document.getElementById('status').textContent = 'Black resigned! White wins! 🎉';
      } else if (data.result === 'draw_agreed') { 
        isResigned = true; // Lock the board
        document.getElementById('status').textContent = '🤝 Game drawn by mutual agreement.';
      }
      }
    );

    socket.on('invalid_move', () => {
      board.position(game.fen()); // snap back
    });

    socket.on('draw_requested', (data) => {
      // Make sure the person who clicked 'offer' doesn't get asked
      if (data.from_user !== username) {
        if (confirm("Your opponent has offered a draw. Do you accept?")) {
          socket.emit('draw_accept', { room: roomId });
        }
      }
    });

    socket.on('draw_requested', (data) => {
      // Make sure the person who clicked 'offer' doesn't get asked
      if (data.from_user !== username) {
        if (confirm("Your opponent has offered a draw. Do you accept?")) {
          socket.emit('draw_accept', { room: roomId });
        }
      }
    });

    function onDragStart(source, piece) {
      if (game.game_over() || isResigned || isViewingHistory) return false; 
      const isMyTurn =
        (game.turn() === 'w' && myColor === 'white') ||
        (game.turn() === 'b' && myColor === 'black');
      if (!isMyTurn) return false;
      if (myColor === 'white' && piece.startsWith('b')) return false;
      if (myColor === 'black' && piece.startsWith('w')) return false;
    }

    function onDrop(source, target) {
      if (game.game_over() || isResigned || isViewingHistory) return 'snapback';
      
      const piece = game.get(source);
      
      // 1. Detect if it is a pawn promotion
      if (piece && piece.type === 'p') {
        const isWhitePromotion = (piece.color === 'w' && target.charAt(1) === '8');
        const isBlackPromotion = (piece.color === 'b' && target.charAt(1) === '1');
        
        if (isWhitePromotion || isBlackPromotion) {
          // Check if the move is actually legal first (e.g., not blocked)
          const tempMove = game.move({ from: source, to: target, promotion: 'q' });
          if (tempMove === null) return 'snapback';
          game.undo(); // Undo it immediately, we just wanted to verify it's legal

          // Open the menu and store the move coordinates
          pendingPromotion = { source: source, target: target };
          document.getElementById('promotion-menu').style.display = 'block';
          
          // Force the pawn to visually snap back to its starting square while waiting for user input
          return 'snapback';
        }
      }

      // 2. Normal move processing (if it is not a promotion)
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      
      socket.emit('move', { 
          room: roomId, 
          username: username, 
          move: move.from + move.to + (move.promotion || '') 
      });
    }

    function choosePromotion(pieceType) {
      if (!pendingPromotion) return;
      
      // Execute the move locally using the piece they clicked
      const move = game.move({ 
        from: pendingPromotion.source, 
        to: pendingPromotion.target, 
        promotion: pieceType 
      });
      
      if (move) {
        // Send the completed move to the Python backend
        socket.emit('move', { 
            room: roomId, 
            username: username, 
            move: move.from + move.to + pieceType
        });
      }
      
      // Hide the menu and clear the pending move
      document.getElementById('promotion-menu').style.display = 'none';
      pendingPromotion = null;
    }

    function cancelPromotion() {
      // If they change their mind, just hide the menu
      document.getElementById('promotion-menu').style.display = 'none';
      pendingPromotion = null;
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function updateMoveList() {
      const history = game.history(); // Auto-generates notation like ['e4', 'e5', 'Nf3']
      const table = document.getElementById('move-table');
      table.innerHTML = '';
      
      for (let i = 0; i < history.length; i += 2) {
        const moveNum = (i / 2) + 1;
        const whiteMove = history[i];
        const blackMove = history[i+1] ? history[i+1] : '';
        
        // Highlight the move we are currently looking at in crimson
        const activeIndex = currentMoveOffset - 1;
        const wStyle = (activeIndex === i) ? 'color: #e94560; font-weight: bold;' : '';
        const bStyle = (activeIndex === i+1) ? 'color: #e94560; font-weight: bold;' : '';

        table.innerHTML += `
          <tr>
            <td style="width: 20%; color: #888;">${moveNum}.</td>
            <td style="width: 40%; ${wStyle}">${whiteMove}</td>
            <td style="width: 40%; ${bStyle}">${blackMove}</td>
          </tr>
        `;
      }
      
      // Auto-scroll the move list to the bottom
      const container = document.getElementById('move-list-container');
      if (!isViewingHistory) container.scrollTop = container.scrollHeight;
    }

    function navigateHistory(step) {
      const history = game.history();
      currentMoveOffset += step;
      
      if (currentMoveOffset < 0) currentMoveOffset = 0; // Don't go before move 0
      
      if (currentMoveOffset >= history.length) {
        // Back to live view
        currentMoveOffset = history.length;
        isViewingHistory = false;
        board.position(game.fen());
      } else {
        // Looking at the past: build a temporary board up to that specific move
        isViewingHistory = true;
        let tempGame = new Chess();
        for (let i = 0; i < currentMoveOffset; i++) {
          tempGame.move(history[i]);
        }
        board.position(tempGame.fen());
      }
      updateMoveList();
    }

  </script>
</body>
</html>
