<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Online</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="container">
    <h1>♟ Chess Online</h1>

    <div id="lobby">
      <input id="room-input" placeholder="Enter room code (e.g. room1)" />
      <button onclick="joinGame()">Join Game</button>
    </div>

    <div id="game" class="hidden">
      <div id="status"></div>

      <div class="game-layout">

        <!-- Left Side: Board & Buttons -->
        <div class="board-column">
          <div id="promotion-menu">
            <p>Choose Promotion Piece:</p>
            <button onclick="choosePromotion('q')">♕ Queen</button>
            <button onclick="choosePromotion('r')">♖ Rook</button>
            <button onclick="choosePromotion('b')">♗ Bishop</button>
            <button onclick="choosePromotion('n')">♘ Knight</button>
            <button class="cancel-btn" onclick="cancelPromotion()">Cancel</button>
          </div>

          <div id="board"></div>
          <div id="turn-indicator"></div>
          <br>

          <div class="history-nav">
            <button onclick="navigateHistory(-1)">⬅️ Back</button>
            <button onclick="navigateHistory(1)">Forward ➡️</button>
          </div>

          <button onclick="leaveRoom()">Return to Lobby</button>
          <button onclick="resignGame()">Resign</button>
          <button onclick="offerDraw()">Offer Draw</button>
        </div>

        <!-- Right Side: Move List -->
        <div id="move-list-container">
          <h3>Move List</h3>
          <table>
            <tbody id="move-table">
              <!-- Moves will be injected here via JavaScript -->
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
